name: Operator Frontend Wiring

on:
  push:
    branches: [agent/operator-data-plane]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wire Operator Center and recorded health polling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/HealthPanel.tsx')
          s = p.read_text()
          s = s.replace('import * as api from "../api";', 'import * as operatorApi from "../operatorApi";')
          s = s.replace('api.healthCollect(', 'operatorApi.healthCollect(')
          if 'operatorApi.healthCollect(' not in s:
              raise SystemExit('HealthPanel operator health wiring missing')
          p.write_text(s)

          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace(
              'import { JumpHostManager } from "./components/JumpHostManager";',
              'import { JumpHostManager } from "./components/JumpHostManager";\nimport { OperatorCenter } from "./components/OperatorCenter";'
          )
          s = s.replace(
              'import { useSettingsStore } from "./settingsStore";',
              'import { useSettingsStore } from "./settingsStore";\nimport * as operatorApi from "./operatorApi";'
          )
          s = s.replace(
              '  const [showJumpHosts, setShowJumpHosts] = useState(false);',
              '  const [showJumpHosts, setShowJumpHosts] = useState(false);\n  const [showOperatorCenter, setShowOperatorCenter] = useState(false);'
          )
          s = s.replace(
              '    void loadSettings().catch(() => undefined);',
              '    void loadSettings().catch(() => undefined);\n    void operatorApi.bootstrap().catch(() => undefined);'
          )
          s = s.replace(
              '<button className="tiny" onClick={() => setShowTunnels(true)}>Tunnels</button>',
              '<button className="tiny" onClick={() => setShowTunnels(true)}>Tunnels</button>\n        <button className="tiny" onClick={() => setShowOperatorCenter(true)}>Operations</button>'
          )
          s = s.replace(
              '{showJumpHosts && <JumpHostManager onClose={() => setShowJumpHosts(false)} />}',
              '{showJumpHosts && <JumpHostManager onClose={() => setShowJumpHosts(false)} />}\n      {showOperatorCenter && <OperatorCenter onClose={() => setShowOperatorCenter(false)} />}'
          )
          required = ['OperatorCenter', 'operatorApi.bootstrap()', 'setShowOperatorCenter(true)']
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit(f'App operator wiring missing: {missing}')
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/components/HealthPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: wire operator center into app workflows'
          git push origin HEAD:agent/operator-data-plane
