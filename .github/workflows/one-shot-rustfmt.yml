name: One-shot Rustfmt Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/operator-experience-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/operator-experience-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format Rust sources
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/one-shot-rustfmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src
          git commit -m 'style: apply rustfmt to operator experience'
          git push origin HEAD:agent/operator-experience-v2
