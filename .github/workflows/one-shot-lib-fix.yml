name: One-shot Lib Import Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/operator-data-plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/operator-data-plane
          fetch-depth: 0
      - name: Remove duplicate import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/src/lib.rs')
          text = path.read_text()
          duplicate = 'use transfer_manager::TransferManager;\nuse transfer_manager::TransferManager;\n'
          if duplicate not in text:
              raise SystemExit('expected duplicate import not found')
          path.write_text(text.replace(duplicate, 'use transfer_manager::TransferManager;\n', 1))
          PY
          git rm .github/workflows/one-shot-lib-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/lib.rs
          git commit -m 'fix: remove duplicate transfer manager import'
          git push origin HEAD:agent/operator-data-plane
