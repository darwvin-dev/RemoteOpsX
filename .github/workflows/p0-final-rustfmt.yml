name: P0 Final Rustfmt

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p0-final-rustfmt.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/p0-security-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/p0-security-hardening
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format Rust and remove helper
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          rm .github/workflows/p0-final-rustfmt.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src .github/workflows/p0-final-rustfmt.yml
          git commit -m "style: format final P0 Rust changes"
          git push origin HEAD:agent/p0-security-hardening
