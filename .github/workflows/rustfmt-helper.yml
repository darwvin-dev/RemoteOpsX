name: Rustfmt Helper

on:
  push:
    branches: [agent/ssh-integration-proxyjump]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Package formatted Rust sources
        run: tar -czf /tmp/rustfmt-output.tar.gz src-tauri/src src-tauri/tests
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: /tmp/rustfmt-output.tar.gz
          retention-days: 1
