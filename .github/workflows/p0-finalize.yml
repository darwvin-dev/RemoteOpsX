name: P0 Finalize

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p0-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/p0-security-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/p0-security-hardening
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Close persistence-guard gaps
        shell: python
        run: |
          from pathlib import Path

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text()

          old = '''    reject_known_secret("content_yaml", &content_yaml)?;
              reject_known_secret("description", &description)?;'''
          new = '''    reject_known_secret("runbook.name", &name)?;
              reject_known_secret("runbook.description", &description)?;
              reject_known_secret("runbook.content_yaml", &content_yaml)?;'''
          if old not in text:
              raise SystemExit('runbook guard anchor missing')
          text = text.replace(old, new, 1)

          old = '''    reject_known_secret("snippet.command", &input.command)?;
              let conn = state.db.lock().unwrap();'''
          new = '''    let snippet_text = std::iter::once(input.label.as_str())
                  .chain(std::iter::once(input.command.as_str()))
                  .chain(input.tags.iter().map(String::as_str))
                  .collect::<Vec<_>>()
                  .join("\\n");
              reject_known_secret("snippet", &snippet_text)?;
              let conn = state.db.lock().unwrap();'''
          if old not in text:
              raise SystemExit('snippet guard anchor missing')
          text = text.replace(old, new, 1)

          old = '''    validate_tunnel_start_input(&tunnel)?;
              let server = load_server(&state, &tunnel.server_id)?;'''
          new = '''    let tunnel_text = [
                  tunnel.r#type.as_str(),
                  tunnel.local_host.as_deref().unwrap_or_default(),
                  tunnel.remote_host.as_deref().unwrap_or_default(),
              ]
              .join("\\n");
              reject_known_secret("tunnel", &tunnel_text)?;
              validate_tunnel_start_input(&tunnel)?;
              let server = load_server(&state, &tunnel.server_id)?;'''
          if old not in text:
              raise SystemExit('tunnel guard anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove temporary workflow
        run: rm .github/workflows/p0-finalize.yml
      - name: Commit final P0 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src .github/workflows/p0-finalize.yml
          git commit -m "security: close P0 persistence guard gaps"
          git push origin HEAD:agent/p0-security-hardening
