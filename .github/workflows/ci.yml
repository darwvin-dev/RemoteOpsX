name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1
  RUST_VERSION: 1.97.1

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri and SSH fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            openssh-server \
            sshpass

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Security invariants
        run: bash scripts/security-gates.sh

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Frontend tests
        run: npm test

      - name: Frontend type-check + build
        run: npm run build

      - name: Rust formatting
        id: rustfmt_check
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Capture formatted Rust sources
        if: steps.rustfmt_check.outcome == 'failure'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          tar -czf /tmp/rustfmt-output.tar.gz src-tauri/src src-tauri/tests

      - name: Upload rustfmt repair artifact
        if: steps.rustfmt_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: /tmp/rustfmt-output.tar.gz
          retention-days: 1

      - name: Enforce Rust formatting gate
        if: steps.rustfmt_check.outcome == 'failure'
        run: exit 1

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Live SSH integration fixture
        run: bash scripts/ci-live-ssh.sh

      - name: Rust build
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Security invariants
        run: bash scripts/security-gates.sh

      - name: Frontend tests
        run: npm test

      - name: Frontend type-check + build
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust build
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
