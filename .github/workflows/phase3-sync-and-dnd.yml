name: Phase3 Sync and SFTP Drag Drop

on:
  push:
    branches: [agent/operator-experience]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Merge latest operator data-plane branch
        run: |
          git fetch origin agent/operator-data-plane
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/agent/operator-data-plane
      - name: Add Tauri-native SFTP drag and drop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/SftpPanel.tsx')
          s = p.read_text()
          if 'getCurrentWebview' not in s:
              s = s.replace(
                  'import { open as openDialog, save as saveDialog } from "@tauri-apps/plugin-dialog";',
                  'import { open as openDialog, save as saveDialog } from "@tauri-apps/plugin-dialog";\nimport { getCurrentWebview } from "@tauri-apps/api/webview";'
              )
          if 'const [dragActive' not in s:
              s = s.replace(
                  '  const [loaded, setLoaded] = useState(false);',
                  '  const [loaded, setLoaded] = useState(false);\n  const [dragActive, setDragActive] = useState(false);'
              )
          marker = '''  useEffect(() => {\n    if (active && !loaded) void list(path);\n  }, [active, loaded, path]); // eslint-disable-line react-hooks/exhaustive-deps\n'''
          effect = '''  useEffect(() => {\n    if (active && !loaded) void list(path);\n  }, [active, loaded, path]); // eslint-disable-line react-hooks/exhaustive-deps\n\n  useEffect(() => {\n    if (!active || protocol !== "sftp") return;\n    let disposed = false;\n    let unlisten: (() => void) | undefined;\n    void getCurrentWebview().onDragDropEvent((event) => {\n      if (disposed) return;\n      if (event.payload.type === "enter" || event.payload.type === "over") {\n        setDragActive(true);\n        return;\n      }\n      if (event.payload.type === "leave") {\n        setDragActive(false);\n        return;\n      }\n      if (event.payload.type === "drop") {\n        setDragActive(false);\n        const droppedPaths = event.payload.paths;\n        void Promise.all(droppedPaths.map((source) => operatorApi.transferStart({\n          server_id: server.id,\n          direction: "upload",\n          source,\n          destination: path,\n          recursive: true,\n        }))).then((jobs) => {\n          pushAlert("info", `${jobs.length} dropped item${jobs.length === 1 ? "" : "s"} queued for SFTP upload.`);\n        }).catch((error) => pushAlert("error", `SFTP drag/drop: ${error}`));\n      }\n    }).then((cleanup) => {\n      if (disposed) cleanup(); else unlisten = cleanup;\n    }).catch((error) => pushAlert("error", `SFTP drag/drop listener: ${error}`));\n    return () => {\n      disposed = true;\n      setDragActive(false);\n      unlisten?.();\n    };\n  }, [active, path, protocol, pushAlert, server.id]);\n'''
          if marker in s and 'onDragDropEvent' not in s:
              s = s.replace(marker, effect)
          elif 'onDragDropEvent' not in s:
              raise SystemExit('SftpPanel load-effect marker missing')
          s = s.replace(
              '<div className="sftp">',
              '<div className={`sftp${dragActive ? " drag-active" : ""}`}>',
              1,
          )
          badge = '''        {protocol === "sftp" && dragActive && <span className="status-badge status-ok">drop to upload</span>}\n'''
          target = '        {protocol === "sftp" && <span className="status-badge status-ok" title="Transfers reuse a persistent SSH ControlMaster">persistent</span>}\n'
          if badge not in s:
              if target not in s:
                  raise SystemExit('persistent badge marker missing')
              s = s.replace(target, target + badge)
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Remove helper and push
        run: |
          git rm .github/workflows/phase3-sync-and-dnd.yml
          git add src/components/SftpPanel.tsx src-tauri/src
          git commit -am 'feat: add native drag-drop uploads and sync operator fixes'
          git push origin HEAD:agent/operator-experience
