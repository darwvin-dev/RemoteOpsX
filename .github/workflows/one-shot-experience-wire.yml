name: One-shot Experience Wiring

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.ref == 'agent/operator-experience-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/operator-experience-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Register experience commands and cancellation UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src-tauri/src/lib.rs')
          s = p.read_text()
          if 'pub mod experience_commands;' not in s:
              marker = 'pub mod error;\n'
              if marker not in s:
                  raise SystemExit('lib module marker missing')
              s = s.replace(marker, marker + 'pub mod experience_commands;\n', 1)
          handler_marker = '            operator_commands::multi_host_run,\n'
          if 'operator_commands::multi_host_cancel' not in s:
              if handler_marker not in s:
                  raise SystemExit('multi-host handler marker missing')
              s = s.replace(handler_marker, handler_marker + '            operator_commands::multi_host_cancel,\n', 1)
          save_marker = '            save_text_file,\n'
          experience_handlers = '''            experience_commands::runbook_preview_yaml,\n            experience_commands::runbook_preview_saved,\n            experience_commands::runbook_import_yaml,\n            experience_commands::runbook_export_yaml,\n            experience_commands::operator_dashboard_summary,\n'''
          if 'experience_commands::runbook_preview_saved' not in s:
              if save_marker not in s:
                  raise SystemExit('save_text_file handler marker missing')
              s = s.replace(save_marker, experience_handlers + save_marker, 1)
          p.write_text(s)

          p = Path('src/components/OperatorCenter.tsx')
          s = p.read_text()
          state_marker = '  const [run, setRun] = useState<MultiHostRun | null>(null);\n'
          if 'const [runningId' not in s:
              if state_marker not in s:
                  raise SystemExit('OperatorCenter run state marker missing')
              s = s.replace(
                  state_marker,
                  state_marker + '  const [runningId, setRunningId] = useState<string | null>(null);\n  const [cancelRequested, setCancelRequested] = useState(false);\n',
                  1,
              )

          old_execute = '''  async function execute() {\n    try {\n      setRun(await operatorApi.multiHostRun({\n        server_ids: selected,\n        command,\n        concurrency,\n        production_confirmed: productionConfirmed,\n        destructive_confirmed: destructiveConfirmed,\n      }));\n    } catch (reason) { reportError(reason); }\n  }'''
          new_execute = '''  async function execute() {\n    const runId = crypto.randomUUID();\n    setRunningId(runId);\n    setCancelRequested(false);\n    setRun(null);\n    try {\n      setRun(await operatorApi.multiHostRun({\n        run_id: runId,\n        server_ids: selected,\n        command,\n        concurrency,\n        production_confirmed: productionConfirmed,\n        destructive_confirmed: destructiveConfirmed,\n      }));\n    } catch (reason) {\n      reportError(reason);\n    } finally {\n      setRunningId(null);\n      setCancelRequested(false);\n    }\n  }\n\n  async function cancelRun() {\n    if (!runningId) return;\n    setCancelRequested(true);\n    try {\n      await operatorApi.multiHostCancel(runningId);\n    } catch (reason) {\n      reportError(reason);\n      setCancelRequested(false);\n    }\n  }'''
          if 'async function cancelRun()' not in s:
              if old_execute not in s:
                  raise SystemExit('OperatorCenter execute marker missing')
              s = s.replace(old_execute, new_execute, 1)

          old_button = '<button className="primary" disabled={!selected.length || !command.trim()} onClick={() => void execute()}>Run on {selected.length} host{selected.length === 1 ? "" : "s"}</button>'
          new_button = '''<div className="flex">\n        <button className="primary" disabled={Boolean(runningId) || !selected.length || !command.trim()} onClick={() => void execute()}>\n          {runningId ? "Running…" : `Run on ${selected.length} host${selected.length === 1 ? "" : "s"}`}\n        </button>\n        {runningId ? <button className="warn" disabled={cancelRequested} onClick={() => void cancelRun()}>{cancelRequested ? "Cancellation requested…" : "Cancel remaining batches"}</button> : null}\n      </div>\n      {runningId ? <div className="panel-hint">Cancellation stops new batches; SSH commands already in flight finish and remain audited.</div> : null}'''
          if 'Cancel remaining batches' not in s:
              if old_button not in s:
                  raise SystemExit('OperatorCenter execute button marker missing')
              s = s.replace(old_button, new_button, 1)
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Commit wiring and remove helper
        run: |
          git rm .github/workflows/one-shot-experience-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/lib.rs src/components/OperatorCenter.tsx
          git commit -m 'fix: wire operator experience commands and cancellation'
          git push origin HEAD:agent/operator-experience-v2
