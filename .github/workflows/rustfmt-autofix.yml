name: Rustfmt Autofix

on:
  push:
    branches: [agent/ssh-integration-proxyjump]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit only formatting changes
        run: |
          if git diff --quiet -- src-tauri/src src-tauri/tests; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src src-tauri/tests
          git commit -m 'style: apply canonical rustfmt'
          git push origin HEAD:agent/ssh-integration-proxyjump
