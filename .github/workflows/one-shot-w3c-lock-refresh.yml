name: One-shot W3C Lock Refresh

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'agent/packaged-desktop-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/packaged-desktop-e2e
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - name: Regenerate npm lockfile from the reduced dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify locked install
        run: npm ci
      - name: Keep full dependency audit strict
        run: npm audit --audit-level=high
      - name: Verify security source gates
        run: bash scripts/security-gates.sh
      - name: Verify frontend build
        run: npm run build
      - name: Commit lockfile and remove helper
        run: |
          git rm .github/workflows/one-shot-w3c-lock-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m 'test: prune vulnerable webdriverio dependency graph'
          git push origin HEAD:agent/packaged-desktop-e2e
