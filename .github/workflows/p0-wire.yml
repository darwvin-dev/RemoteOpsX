name: P0 Wire

on:
  push:
    branches: [agent/p0-security-hardening]
    paths: [.github/workflows/p0-wire.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/p0-security-hardening
      - name: Wire security modules and frontend API
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src-tauri/src/lib.rs",
              "pub mod health_collector;\npub mod models;",
              "pub mod health_collector;\npub mod host_identity;\npub mod models;\npub mod redaction;\npub mod recovery;\npub mod runtime_preflight;",
          )

          replace_once(
              "src-tauri/src/lib.rs",
              "// =================== Live Health ===================",
              """// =================== Production preflight / host identity ===================

#[tauri::command]
fn runtime_preflight() -> CommandResult<runtime_preflight::RuntimePreflightReport> {
    Ok(runtime_preflight::collect())
}

#[tauri::command]
fn ssh_host_identity_inspect(
    state: State<AppState>,
    server_id: String,
) -> CommandResult<host_identity::HostIdentityReport> {
    let server = load_server(&state, &server_id)?;
    re(host_identity::inspect(&server.host, server.port))
}

#[tauri::command]
fn ssh_host_identity_trust(
    state: State<AppState>,
    server_id: String,
    expected_fingerprint: String,
    replace: bool,
) -> CommandResult<host_identity::HostIdentityReport> {
    let server = load_server(&state, &server_id)?;
    re(host_identity::trust(
        &server.host,
        server.port,
        &expected_fingerprint,
        replace,
    ))
}

#[tauri::command]
fn ssh_host_identity_remove(state: State<AppState>, server_id: String) -> CommandResult<()> {
    let server = load_server(&state, &server_id)?;
    re(host_identity::remove(&server.host, server.port))
}

// =================== Live Health ===================""",
          )

          replace_once(
              "src-tauri/src/lib.rs",
              "    Ok(runbook_runner::run_step(&server, &step))",
              "    Ok(redaction::redact_step_result(runbook_runner::run_step(&server, &step)))",
          )

          replace_once(
              "src-tauri/src/lib.rs",
              "        results,\n    };",
              "        results: results.into_iter().map(redaction::redact_step_result).collect(),\n    };",
          )

          replace_once(
              "src-tauri/src/lib.rs",
              "fn save_text_file(path: String, content: String) -> CommandResult<()> {\n    e(std::fs::write(&path, content))\n}",
              "fn save_text_file(path: String, content: String) -> CommandResult<()> {\n    e(std::fs::write(&path, redaction::redact(content)))\n}",
          )

          replace_once(
              "src-tauri/src/lib.rs",
              "            let data_dir = app.path().app_data_dir().expect(\"no app data dir\");\n            let db_path = data_dir.join(\"remoteopsx.db\");\n            let conn = database::open(&db_path).expect(\"failed to open database\");",
              """            let data_dir = app.path().app_data_dir().expect(\"no app data dir\");
            host_identity::init(data_dir.join(\"known_hosts\"))
                .expect(\"failed to initialize SSH host identity store\");
            let db_path = data_dir.join(\"remoteopsx.db\");
            let conn = database::open(&db_path).expect(\"failed to open database\");
            let recovered = recovery::reconcile_startup(&conn)
                .expect(\"failed to reconcile stale runtime state\");
            if recovered.sessions_interrupted > 0
                || recovered.tunnels_stopped > 0
                || recovered.runbooks_interrupted > 0
            {
                eprintln!(
                    \"startup recovery: {} session(s) interrupted, {} tunnel(s) stopped, {} runbook(s) interrupted\",
                    recovered.sessions_interrupted,
                    recovered.tunnels_stopped,
                    recovered.runbooks_interrupted
                );
            }""",
          )

          replace_once(
              "src-tauri/src/lib.rs",
              "            ssh_key_install,\n            health_collect,",
              "            ssh_key_install,\n            runtime_preflight,\n            ssh_host_identity_inspect,\n            ssh_host_identity_trust,\n            ssh_host_identity_remove,\n            health_collect,",
          )

          replace_once(
              "src/types.ts",
              "// ---- UI-only types ----",
              """export interface HostKeyCandidate {
  key_type: string;
  fingerprint: string;
}

export interface HostIdentityReport {
  host: string;
  port: number;
  status: \"unseen\" | \"trusted\" | \"changed\";
  candidates: HostKeyCandidate[];
  trusted_fingerprints: string[];
}

export interface RuntimeDependencyStatus {
  id: string;
  label: string;
  required: boolean;
  available: boolean;
  detail: string;
}

export interface RuntimePreflightReport {
  ready: boolean;
  dependencies: RuntimeDependencyStatus[];
}

// ---- UI-only types ----""",
          )

          replace_once(
              "src/api.ts",
              "  HealthSnapshot,\n  RemoteFile,",
              "  HealthSnapshot,\n  HostIdentityReport,\n  RuntimePreflightReport,\n  RemoteFile,",
          )

          replace_once(
              "src/api.ts",
              "// ---- Health ----\nexport const healthCollect",
              """// ---- Runtime / SSH trust ----
export const runtimePreflight = () => invoke<RuntimePreflightReport>(\"runtime_preflight\");
export const sshHostIdentityInspect = (serverId: string) =>
  invoke<HostIdentityReport>(\"ssh_host_identity_inspect\", { serverId });
export const sshHostIdentityTrust = (serverId: string, expectedFingerprint: string, replace = false) =>
  invoke<HostIdentityReport>(\"ssh_host_identity_trust\", { serverId, expectedFingerprint, replace });
export const sshHostIdentityRemove = (serverId: string) =>
  invoke<void>(\"ssh_host_identity_remove\", { serverId });

// ---- Health ----
export const healthCollect""",
          )

          Path(".github/workflows/p0-wire.yml").unlink()
      - name: Commit wired P0 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src/types.ts src/api.ts .github/workflows/p0-wire.yml
          git commit -m "security: wire P0 trust and recovery commands"
          git push origin HEAD:agent/p0-security-hardening
