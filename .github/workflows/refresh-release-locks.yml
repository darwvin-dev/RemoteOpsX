name: Refresh Release Locks

on:
  push:
    branches: [agent/release-foundation]
    paths: [.github/workflows/refresh-release-locks.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/release-foundation
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Refresh lockfile workspace metadata only
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          npm ci
          npm run version:check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-run
          rm .github/workflows/refresh-release-locks.yml
      - name: Commit refreshed locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock .github/workflows/refresh-release-locks.yml
          git commit -m "build: refresh release lockfile metadata"
          git push origin HEAD:agent/release-foundation
