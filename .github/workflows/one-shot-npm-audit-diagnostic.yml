name: One-shot NPM Audit Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  audit-diagnostic:
    if: github.event.pull_request.head.ref == 'agent/packaged-desktop-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/packaged-desktop-e2e
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Print high and critical advisory chains
        run: |
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {})
            .filter(([, value]) => ['high', 'critical'].includes(value.severity))
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              range: value.range,
              via: value.via,
              effects: value.effects,
              nodes: value.nodes,
              fixAvailable: value.fixAvailable,
            }));
          console.log('REMOTEOPSX_AUDIT_DIAGNOSTIC_BEGIN');
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: rows }, null, 2));
          console.log('REMOTEOPSX_AUDIT_DIAGNOSTIC_END');
          if (rows.length === 0) console.log('No high/critical vulnerabilities remain.');
          NODE
      - name: Remove diagnostic helper
        run: |
          git rm .github/workflows/one-shot-npm-audit-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove npm audit diagnostic helper'
          git push origin HEAD:agent/packaged-desktop-e2e
