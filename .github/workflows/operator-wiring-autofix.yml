name: Operator Wiring Autofix

on:
  push:
    branches: [agent/operator-data-plane]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wire operator modules into Tauri command surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              'pub mod models;\npub mod pty_manager;',
              'pub mod models;\npub mod multi_host;\npub mod operator_commands;\npub mod operator_data;\npub mod pty_manager;'
          )
          s = s.replace(
              'pub mod tunnel_manager;\npub mod vault;',
              'pub mod transfer_manager;\npub mod tunnel_manager;\npub mod tunnel_resilience;\npub mod vault;\npub mod workspace_backup;'
          )
          s = s.replace(
              'use tunnel_manager::TunnelManager;',
              'use transfer_manager::TransferManager;\nuse tunnel_manager::TunnelManager;'
          )
          s = s.replace(
              '    tunnels: TunnelManager,\n}',
              '    tunnels: TunnelManager,\n    transfers: TransferManager,\n}'
          )
          s = s.replace(
              '                tunnels: TunnelManager::new(),\n            });',
              '                tunnels: TunnelManager::new(),\n                transfers: TransferManager::new(),\n            });'
          )
          marker = '            save_text_file,\n'
          additions = '''            operator_commands::operator_bootstrap,\n            operator_commands::operator_health_collect,\n            operator_commands::health_history_list,\n            operator_commands::alert_rules_list,\n            operator_commands::alert_rule_save,\n            operator_commands::alert_rule_delete,\n            operator_commands::operator_alerts_list,\n            operator_commands::operator_alert_acknowledge,\n            operator_commands::transfer_start,\n            operator_commands::transfer_cancel,\n            operator_commands::transfer_jobs_list,\n            operator_commands::transfer_chmod,\n            operator_commands::tunnel_policies_list,\n            operator_commands::tunnel_policy_save,\n            operator_commands::tunnels_reconcile,\n            operator_commands::multi_host_run,\n            operator_commands::multi_host_runs_list,\n            operator_commands::workspace_backup_export,\n            operator_commands::workspace_backup_import,\n'''
          if additions not in s:
              s = s.replace(marker, additions + marker)
          required = [
              'pub mod operator_commands;', 'pub mod transfer_manager;',
              'transfers: TransferManager', 'operator_commands::operator_bootstrap'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'wiring markers missing after patch: {missing}')
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/lib.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: wire operator data plane commands'
          git push origin HEAD:agent/operator-data-plane
