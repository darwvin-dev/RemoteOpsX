name: Phase3 Wiring Autofix

on:
  push:
    branches: [agent/operator-experience]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Wire experience backend and frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Tauri module + command registration.
          p = Path('src-tauri/src/lib.rs')
          s = p.read_text()
          if 'pub mod experience_commands;' not in s:
              s = s.replace('pub mod error;\n', 'pub mod error;\npub mod experience_commands;\n')
          marker = '            operator_commands::operator_bootstrap,\n'
          commands = '''            experience_commands::runbook_preview_yaml,\n            experience_commands::runbook_import_yaml,\n            experience_commands::runbook_export_yaml,\n            experience_commands::operator_dashboard_summary,\n'''
          if commands not in s:
              if marker not in s:
                  raise SystemExit('operator command marker missing in lib.rs')
              s = s.replace(marker, commands + marker)
          p.write_text(s)

          # Experience CSS import.
          p = Path('src/main.tsx')
          s = p.read_text()
          if 'operator-experience.css' not in s:
              s = s.replace('import "./density.css";', 'import "./density.css";\nimport "./operator-experience.css";')
          p.write_text(s)

          # App wiring: Studio state/modal, dashboard callback and palette callbacks.
          p = Path('src/App.tsx')
          s = p.read_text()
          if 'RunbookStudio' not in s:
              s = s.replace(
                  'import { RunbookLauncher } from "./components/RunbookLauncher";',
                  'import { RunbookLauncher } from "./components/RunbookLauncher";\nimport { RunbookStudio } from "./components/RunbookStudio";'
              )
          if 'showRunbookStudio' not in s:
              s = s.replace(
                  '  const [showRunbooks, setShowRunbooks] = useState(false);',
                  '  const [showRunbooks, setShowRunbooks] = useState(false);\n  const [showRunbookStudio, setShowRunbookStudio] = useState(false);'
              )
          # TabContent gains operator-center callback.
          old = '<TabContent onNewServer={openNewServer} onOpenRunbooks={() => setShowRunbooks(true)} onOpenTunnels={() => setShowTunnels(true)} />'
          new = '<TabContent onNewServer={openNewServer} onOpenRunbooks={() => setShowRunbooks(true)} onOpenTunnels={() => setShowTunnels(true)} onOpenOperations={() => setShowOperatorCenter(true)} />'
          if old in s:
              s = s.replace(old, new)
          elif 'onOpenOperations={() => setShowOperatorCenter(true)}' not in s:
              raise SystemExit('TabContent call shape changed unexpectedly')

          # Add Studio topbar entry beside Runbooks so feature is discoverable outside palette.
          studio_button = '<button className="tiny" onClick={() => setShowRunbookStudio(true)}>Studio</button>'
          if studio_button not in s:
              s = s.replace(
                  '<button className="tiny" onClick={() => setShowRunbooks(true)}>Runbooks</button>',
                  '<button className="tiny" onClick={() => setShowRunbooks(true)}>Runbooks</button>\n        ' + studio_button
              )

          # Extend CommandPalette props.
          palette_marker = '        onOpenRunbooks={() => setShowRunbooks(true)}\n'
          palette_add = '''        onOpenRunbookStudio={() => setShowRunbookStudio(true)}\n        onOpenBastions={() => setShowJumpHosts(true)}\n        onOpenOperations={() => setShowOperatorCenter(true)}\n'''
          if palette_add not in s:
              if palette_marker not in s:
                  raise SystemExit('CommandPalette runbooks prop marker missing')
              s = s.replace(palette_marker, palette_marker + palette_add)

          studio_modal = '{showRunbookStudio && <RunbookStudio onClose={() => setShowRunbookStudio(false)} />}'
          if studio_modal not in s:
              modal_marker = '{showRunbooks && <RunbookLauncher onClose={() => setShowRunbooks(false)} />}'
              if modal_marker not in s:
                  raise SystemExit('RunbookLauncher modal marker missing')
              s = s.replace(modal_marker, modal_marker + '\n      ' + studio_modal)
          p.write_text(s)

          # Replace static no-tab home with live OperationsDashboard.
          p = Path('src/components/TabContent.tsx')
          s = p.read_text()
          if 'OperationsDashboard' not in s:
              s = s.replace(
                  'import { LogsPanel } from "./LogsPanel";',
                  'import { LogsPanel } from "./LogsPanel";\nimport { OperationsDashboard } from "./OperationsDashboard";'
              )
          s = s.replace(
              '  onOpenTunnels,\n}: {\n  onNewServer: (folder?: string) => void;\n  onOpenRunbooks: () => void;\n  onOpenTunnels: () => void;\n}) {',
              '  onOpenTunnels,\n  onOpenOperations,\n}: {\n  onNewServer: (folder?: string) => void;\n  onOpenRunbooks: () => void;\n  onOpenTunnels: () => void;\n  onOpenOperations: () => void;\n}) {'
          )
          pattern = re.compile(r'  if \(!activeTab\) \{\n    return \(.*?\n    \);\n  \}\n\n  if \(!server\)', re.S)
          replacement = '''  if (!activeTab) {\n    return (\n      <OperationsDashboard\n        servers={servers}\n        focusedServer={focusedServer}\n        onFocusServer={setFocusedServer}\n        onOpenTab={openTab}\n        onNewServer={() => onNewServer()}\n        onOpenRunbooks={onOpenRunbooks}\n        onOpenTunnels={onOpenTunnels}\n        onOpenOperations={onOpenOperations}\n      />\n    );\n  }\n\n  if (!server)'''
          next_s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected one no-active-tab block, replaced {count}')
          p.write_text(next_s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/lib.rs src/main.tsx src/App.tsx src/components/TabContent.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: wire dashboard studio and palette experience'
          git push origin HEAD:agent/operator-experience
